[workspace]
members = [
    "fmtools-fs",
    "dupeforge-rs",
    "rename_files_rs",
    "organize_files_rs",
    "convert_media_rs",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
authors = ["Auto-generated"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
fmtools-fs = { path = "fmtools-fs" }

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# File system operations
walkdir = "2.5"

# Hashing
sha2 = "0.10"
md5 = "0.7"

# Parallelism
rayon = "1.10"

# Progress bars
indicatif = { version = "0.17", features = ["rayon"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time/Date
chrono = "0.4"

# Others
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

