name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'toolkit-v')
    name: Build Rust binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build Rust tools
        working-directory: packages/fmtools/rust
        run: cargo build --locked --release --workspace --target ${{ matrix.target }}

      - name: Prepare binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p packages/fmtools/src/fmtools/bin/${{ matrix.artifact_name }}
          for binary in dupeforge-rs rename_files organize_files convert_media; do
              cp "packages/fmtools/rust/target/${{ matrix.target }}/release/${binary}.exe" \
                  "packages/fmtools/src/fmtools/bin/${{ matrix.artifact_name }}/"
          done
        shell: bash

      - name: Prepare binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p packages/fmtools/src/fmtools/bin/${{ matrix.artifact_name }}
          for binary in dupeforge-rs rename_files organize_files convert_media; do
              cp "packages/fmtools/rust/target/${{ matrix.target }}/release/${binary}" \
                  "packages/fmtools/src/fmtools/bin/${{ matrix.artifact_name }}/"
          done
          chmod +x packages/fmtools/src/fmtools/bin/${{ matrix.artifact_name }}/*

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/fmtools/src/fmtools/bin/${{ matrix.artifact_name }}

  publish:
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'toolkit-v')
    name: Publish to PyPI
    needs: build-rust
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: packages/fmtools/src/fmtools/bin/

      - name: Restore Unix executable permissions
        run: |
          for platform in linux macos-x64 macos-arm64; do
            chmod +x "packages/fmtools/src/fmtools/bin/${platform}/"*
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package (fmtools)
        working-directory: packages/fmtools
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload packages/fmtools/dist/*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            packages/fmtools/dist/*.whl
            packages/fmtools/dist/*.tar.gz
